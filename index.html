<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PulsePhone</title>

<style>
:root{
    --accent:#7c5cff;
    --bg:#08090d;
    --screen:#10131b;
    --panel:#191d27;
    --panel2:#242938;
    --text:#fff;
    --muted:#aab1c2;
    --phone:#15161a;
    --wall1:#17132c;
    --wall2:#080a12;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at 20% 10%,#493e79 0,#17162a 25%,#050507 70%);
    color:var(--text);
    font-family:Arial,sans-serif;
    display:grid;
    place-items:center;
    padding:15px;
}

button,input,textarea{
    font:inherit;
}

button{
    color:white;
    border:0;
    cursor:pointer;
}

.phone{
    width:min(430px,96vw);
    height:min(850px,94vh);
    background:var(--phone);
    border:8px solid #030303;
    border-radius:45px;
    overflow:hidden;
    position:relative;
    box-shadow:
        0 30px 100px #000d,
        0 0 0 2px #ffffff10;
}

.screen{
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at 20% 0%,var(--wall1),transparent 45%),
        linear-gradient(160deg,var(--wall1),var(--wall2));
}

.status{
    height:32px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:7px 17px 0;
    font-size:11px;
    position:relative;
    z-index:200;
}

.dynamic-island{
    position:absolute;
    top:7px;
    left:50%;
    transform:translateX(-50%);
    width:90px;
    height:25px;
    border-radius:20px;
    background:#000;
    z-index:250;
}

.appbar{
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 17px;
    position:relative;
    z-index:150;
}

.title{
    font-size:20px;
    font-weight:800;
}

.sub{
    color:var(--muted);
    font-size:12px;
}

.content{
    height:calc(100% - 170px);
    overflow-y:auto;
    padding:8px 15px 90px;
}

.content::-webkit-scrollbar{
    width:4px;
}

.content::-webkit-scrollbar-thumb{
    background:#ffffff22;
    border-radius:20px;
}

.card{
    background:#ffffff09;
    border:1px solid #ffffff12;
    border-radius:20px;
    padding:15px;
    margin-bottom:13px;
}

.homegrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.app{
    min-height:95px;
    border-radius:19px;
    background:
        linear-gradient(145deg,var(--panel2),var(--panel));
    border:1px solid #ffffff12;
    padding:11px 5px;
    transition:.15s;
}

.app:hover{
    transform:translateY(-2px);
    border-color:var(--accent);
}

.emoji{
    display:block;
    font-size:30px;
    margin-bottom:7px;
}

.bigbtn{
    width:100%;
    background:var(--accent);
    padding:12px;
    border-radius:13px;
    font-weight:bold;
    margin-top:9px;
}

.secondary{
    background:#ffffff12;
}

.icon{
    background:#ffffff10;
    border-radius:13px;
    padding:9px 11px;
}

input,textarea{
    width:100%;
    background:#080a0f;
    color:white;
    border:1px solid #ffffff18;
    border-radius:12px;
    padding:12px;
    outline:none;
}

textarea{
    min-height:130px;
    resize:vertical;
}

.bottom{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:74px;
    background:#080a0fee;
    backdrop-filter:blur(18px);
    border-top:1px solid #ffffff10;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    padding:6px;
    z-index:180;
}

.nav{
    background:transparent;
    font-size:10px;
    border-radius:13px;
}

.nav b{
    display:block;
    font-size:20px;
    margin-bottom:2px;
}

.row{
    display:flex;
    align-items:center;
    gap:10px;
    background:#ffffff08;
    padding:11px;
    border-radius:15px;
    margin-bottom:8px;
}

.grow{
    flex:1;
}

.avatar{
    width:44px;
    height:44px;
    border-radius:14px;
    background:#ffffff12;
    display:grid;
    place-items:center;
    font-size:24px;
}

.badge{
    display:inline-block;
    padding:4px 8px;
    border-radius:999px;
    background:var(--accent);
    font-size:10px;
    font-weight:bold;
}

.modal{
    position:absolute;
    inset:0;
    background:#000c;
    z-index:700;
    display:none;
    align-items:flex-end;
}

.modal.show{
    display:flex;
}

.sheet{
    width:100%;
    max-height:88%;
    overflow-y:auto;
    background:#181c27;
    border-radius:28px 28px 0 0;
    padding:18px;
}

.lock{
    position:absolute;
    inset:0;
    background:#07080deF;
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.lock.show{
    display:flex;
}

.gamegrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.game{
    background:#ffffff08;
    border-radius:17px;
    padding:15px;
}

.game button{
    width:100%;
    margin-top:9px;
    padding:9px;
    border-radius:10px;
    background:var(--accent);
}

.colors{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.color{
    width:35px;
    height:35px;
    border-radius:50%;
    border:3px solid transparent;
}

.color.selected{
    border-color:white;
}

.settingsrow{
    padding:14px 0;
    border-bottom:1px solid #ffffff0e;
}

.settingsrow:last-child{
    border:0;
}

.toggle{
    float:right;
    width:52px;
    height:30px;
    background:#3a3f4d;
    border-radius:20px;
    padding:3px;
}

.toggle i{
    display:block;
    width:24px;
    height:24px;
    background:white;
    border-radius:50%;
    transition:.2s;
}

.toggle.on{
    background:var(--accent);
}

.toggle.on i{
    transform:translateX(22px);
}

/* PHONE MODELS */

.phone.iphone{
    border-radius:46px;
}

.phone.samsung{
    border-radius:28px;
}

.phone.pixel{
    border-radius:35px;
}

.phone.nothing{
    border-radius:40px;
}

.phone.pulse{
    border-radius:45px;
}

.phone.iphone .screen{
    background:
        radial-gradient(circle at 80% 15%,#5c3ca8,transparent 30%),
        linear-gradient(150deg,#17122c,#07080e);
}

.phone.samsung .screen{
    background:
        radial-gradient(circle at 15% 15%,#154a77,transparent 35%),
        linear-gradient(150deg,#071b2d,#05080d);
}

.phone.pixel .screen{
    background:
        radial-gradient(circle at 80% 20%,#3b714d,transparent 32%),
        linear-gradient(150deg,#101f18,#060908);
}

.phone.nothing .screen{
    background:
        radial-gradient(circle at 50% 0%,#555 0,#141414 28%,#070707 70%);
}

.phone.pulse .screen{
    background:
        radial-gradient(circle at 20% 0%,#5935a2,transparent 40%),
        linear-gradient(150deg,#17112d,#07090f);
}

/* TIKTOK */

.video-feed{
    position:absolute;
    inset:0;
    z-index:50;
    overflow-y:auto;
    scroll-snap-type:y mandatory;
    scrollbar-width:none;
    background:#000;
}

.video-feed::-webkit-scrollbar{
    display:none;
}

.tiktok-video{
    width:100%;
    height:100%;
    min-height:100%;
    position:relative;
    scroll-snap-align:start;
    background:#000;
    overflow:hidden;
}

.tiktok-video video{
    width:100%;
    height:100%;
    object-fit:cover;
    background:#000;
}

.video-gradient{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:50%;
    background:linear-gradient(transparent,#000d);
    pointer-events:none;
}

.video-top{
    position:absolute;
    top:38px;
    left:14px;
    right:14px;
    display:flex;
    justify-content:space-between;
    z-index:20;
}

.video-back,
.video-upload{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#0009;
    font-size:20px;
}

.video-label{
    background:#0009;
    border-radius:20px;
    padding:9px 14px;
    font-size:12px;
}

.video-info{
    position:absolute;
    left:15px;
    right:75px;
    bottom:25px;
    z-index:20;
}

.video-user{
    font-weight:bold;
    margin-bottom:7px;
}

.video-caption{
    font-size:14px;
    line-height:1.4;
}

.video-actions{
    position:absolute;
    right:9px;
    bottom:24px;
    z-index:30;
    display:flex;
    flex-direction:column;
    gap:13px;
}

.video-action{
    width:48px;
    height:48px;
    border-radius:50%;
    background:#0009;
    backdrop-filter:blur(8px);
    font-size:20px;
}

.video-action span{
    display:block;
    font-size:9px;
}

.progress{
    position:absolute;
    bottom:0;
    left:0;
    height:3px;
    background:white;
    width:0;
    z-index:40;
}

/* GAMES */

.game-canvas{
    width:100%;
    aspect-ratio:1/1;
    background:#071019;
    border-radius:18px;
    display:block;
    border:1px solid #ffffff14;
}

.gamehud{
    display:flex;
    justify-content:space-between;
    padding:8px 2px;
    font-weight:bold;
}

/* PHONE MOCKUP */

.phone-preview{
    height:180px;
    border-radius:28px;
    border:5px solid #030303;
    overflow:hidden;
    position:relative;
    background:var(--wall1);
    margin-bottom:15px;
}

.preview-island{
    width:65px;
    height:18px;
    background:#000;
    border-radius:20px;
    position:absolute;
    top:8px;
    left:50%;
    transform:translateX(-50%);
}

.preview-camera{
    position:absolute;
    top:12px;
    left:12px;
    width:35px;
    height:35px;
    border-radius:50%;
    background:#111;
    box-shadow:18px 0 #111,0 18px #111;
}

/* EMPTY FEED */

.empty-feed{
    height:100%;
    display:grid;
    place-items:center;
    text-align:center;
    padding:35px;
}

/* MOBILE */

@media(max-width:500px){
    body{
        padding:0;
    }

    .phone{
        width:100vw;
        height:100vh;
        border:0;
        border-radius:0;
    }
}
</style>
</head>

<body>

<div class="phone" id="phone">

<div class="screen">

<div class="status" id="status">

</div>

<main class="content" id="content"></main>

<div class="bottom" id="bottom">

    <button class="nav" onclick="calls()">

        <p class="sub">

        <input

        >

        <button
            class="bigbtn"
            onclick="unlock()"
        >
            Unlock
        </button>

    </div>

</div>

</div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://yujhjmpfytmykqhstwwt.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_eWIDGXOHrqhkH6mFXxldig_r7Dh2XgP";

const VIDEO_BUCKET =
"videos";

const db =
window.supabase.createClient(
    SUPABASE_URL,

/* =========================================================
   DATA
========================================================= */

const banned = [
    "dick","fuck","shit","bitch",
    "asshole","bastard","cunt",

];

const colorList = [
    "#7c5cff",

];

const phoneModels = {

    iphone18:{

    },

    galaxy26:{
        name:"Samsung Galaxy Ultra 26",

    pixel:{
        name:"Google Pixel Pro",

    pulse:{
        name:"PulsePhone X",

};


/* =========================================================
   STATE
========================================================= */

let me =
localStorage.getItem("pp_user") || "";

let avatar =
localStorage.getItem("pp_avatar") ||
avatars[0];

let accent =
localStorage.getItem("pp_color") ||
colorList[0];

let model =
localStorage.getItem("pp_model") ||
"pulse";

let silent =
localStorage.getItem("pp_silent") === "1";

let password =
localStorage.getItem("pp_password") || "";

let notes =
localStorage.getItem("pp_notes") || "";

let installed =
JSON.parse(
    localStorage.getItem("pp_installed") || "[]"
);

let localComments =
JSON.parse(
    localStorage.getItem("pp_comments") || "{}"
);

let liked =
JSON.parse(
    localStorage.getItem("pp_liked") || "{}"
);

let content =
document.getElementById("content");


/* =========================================================
   INIT
========================================================= */

function applyAppearance(){

    document.documentElement
        .style
        .setProperty(
            "--accent",
            accent
        );

    document.getElementById("phone")
        .className =
        "phone " +
        phoneModels[model].class;

}

applyAppearance();


function save(){

    localStorage.setItem(
        "pp_user",me
    );

    localStorage.setItem(
        "pp_avatar",avatar
    );

    localStorage.setItem(
        "pp_color",accent
    );

    localStorage.setItem(
        "pp_model",model
    );

    localStorage.setItem(
        "pp_silent",
        silent ? "1":"0"
    );

    localStorage.setItem(
        "pp_password",
        password
    );

    localStorage.setItem(
        "pp_notes",
        notes
    );

    localStorage.setItem(
        "pp_installed",
        JSON.stringify(installed)
    );

    localStorage.setItem(
        "pp_comments",
        JSON.stringify(localComments)
    );

    localStorage.setItem(
        "pp_liked",
        JSON.stringify(liked)
    );
}


function esc(x){

    return String(x)
    .replace(/[&<>"']/g,c=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    }[c]));

}


/* =========================================================
   CLOCK
========================================================= */

function updateClock(){

    const d = new Date();

    document.getElementById(
        "clock"
    ).textContent =
        d.toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}

setInterval(
    updateClock,
    1000
);

updateClock();


/* =========================================================
   HEADER
========================================================= */

function header(title,sub=""){

    document.getElementById(
        "title"
    ).textContent = title;

    document.getElementById(
        "subtitle"
    ).textContent = sub;

}


/* =========================================================
   MODALS
========================================================= */

function openModal(html){

    document.getElementById(
        "sheet"
    ).innerHTML = html;

    document.getElementById(
        "modal"
    ).classList.add("show");

}

function closeModal(){

    document.getElementById(
        "modal"
    ).classList.remove("show");

}


/* =========================================================
   SETUP
========================================================= */

function setup(){

    header(
        "Welcome",
        "Set up your phone"
    );

    content.innerHTML = `

    <div class="card">

        <div style="text-align:center">

            <div style="font-size:65px">
                📱
            </div>

            <h2>
                Choose your username
            </h2>

            <p class="sub">
                This will also be your PulseTube name.
            </p>

        </div>

        <input
            id="usernameInput"
            maxlength="16"
            placeholder="3–16 letters or numbers"
        >

        <button
            class="bigbtn"
            onclick="finishSetup()"
        >
            Continue
        </button>

        <p class="sub" style="text-align:center">

            By continuing, you agree to our

            <span
                style="color:#62a8ff;text-decoration:underline;cursor:pointer"
                onclick="rules()"
            >
                rules
            </span>.

        </p>

    </div>

    `;

}


function finishSetup(){

    const u =
        document.getElementById(
            "usernameInput"
        ).value.trim();

    if(
        !/^[A-Za-z0-9]{3,16}$/.test(u)
    ){

        alert(
            "Use 3–16 letters or numbers."
        );

        return;
    }

    if(
        banned.some(
            w =>
            u.toLowerCase().includes(w)
        )
    ){

        alert(
            "That username isn't allowed."
        );

        return;
    }

    me = u;

    save();

    home();

}


/* =========================================================
   HOME
========================================================= */

function home(){

    if(!me){

    }

    header(

    );

    content.innerHTML = `

/* =========================================================
   GOOGLE SEARCH
========================================================= */

function searchApp(){

    header(
        "Google",
        "Search the web"
    );

    content.innerHTML = `

    <div class="card">

        <h2>
            🔎 Google
        </h2>

        <p class="sub">
            Search opens real Google results.
        </p>

        <input
            id="googleInput"
            placeholder="Search Google..."
            onkeydown="
                if(event.key==='Enter')
                googleSearch()
            "
        >

        <button
            class="bigbtn"
            onclick="googleSearch()"

        </button>

    </div>

    `;

function googleSearch(){

    const q =
        document.getElementById(
            "googleInput"
        ).value.trim();

    if(!q)
        return;

    const bad = [
        "porn",
        "nude",
        "nudes",
        "sex video",
        "xxx",
        "gore",
        "suicide",
        "self harm",
        "drugs",
        "weapon"
    ];

    if(
        bad.some(
            x =>
            q.toLowerCase().includes(x)
        )
    ){

        alert(
            "That search is blocked by PulsePhone."
        );

        return;
    }

    window.open(
        "https://www.google.com/search?q="+
        encodeURIComponent(q),
        "_blank"
    );

/* =========================================================
   CALCULATOR

function calculator(){

    content.innerHTML = `

    ).value = calcValue;

function calcEquals(){

    try{

        let e =
            calcValue
            .replaceAll("×","*")
            .replaceAll("÷","/");

        if(
            !/^[0-9+\-*/.() ]+$/.test(e)
        )
            throw 1;

        calcValue =
            String(
                Function(
                    "return "+e
                )()
            );

    }catch{

        calcValue="Error";

    }

    document.getElementById(
        "calc"
    ).value=calcValue;

}

function setupFeed(){

    const feed =
        document.getElementById(
            "videoFeed"
        );

    const vids =
        feed.querySelectorAll(
            "video"
        );

    const observer =
        new IntersectionObserver(
            entries=>{

                entries.forEach(
                    e=>{

                        const v=e.target;

                        if(e.isIntersecting){

                            v.play()
                            .catch(
                                ()=>{}
                            );

                        }else{

                            v.pause();

                        }

                    }
                );

            },
            {
                threshold:.75
            }
        );

    vids.forEach(
        (v,i)=>{

            observer.observe(v);

            v.addEventListener(
                "click",
                ()=>{

                    if(v.paused)
                        v.play();
                    else
                        v.pause();

                }
            );

            v.addEventListener(
                "timeupdate",
                ()=>{

                    if(!v.duration)
                        return;

                    document.getElementById(
                        "progress"+i
                    ).style.width =
                        (
                            v.currentTime/
                            v.duration*
                            100
                        )+"%";

                }
            );

        }
    );


    let busy=false;

    feed.addEventListener(
        "wheel",
        e=>{

            if(busy)
                return;

            busy=true;

            feed.scrollBy({
                top:
                    e.deltaY>0
                    ?feed.clientHeight
                    :-feed.clientHeight,
                behavior:"smooth"
            });

            setTimeout(
                ()=>busy=false,
                550
            );

        }
    );

}

async function startRecording(){

    try{

        cameraStream =
            await navigator.mediaDevices
            .getUserMedia({
                video:true,
                audio:true
            });

        const preview =
            document.getElementById(
                "cameraPreview"
            );

        preview.srcObject =
            cameraStream;

        preview.style.display="block";

        recordingChunks=[];

        recorder =
            new MediaRecorder(
                cameraStream,
                {
                    mimeType:
                    MediaRecorder.isTypeSupported(
                        "video/webm"
                    )
                    ?"video/webm"
                    :""
                }
            );

        recorder.ondataavailable =
            e=>{

                if(e.data.size)
                    recordingChunks.push(
                        e.data
                    );

            };

        recorder.onstop =
            finishRecording;

        recorder.start();

        document.getElementById(
            "recordStatus"
        ).textContent =
            "🔴 Recording...";

    }catch(e){

        alert(
            "Camera/microphone permission was denied or isn't available."
        );

    }

}


function stopRecording(){

    if(!recorder)
        return;

    if(
        recorder.state !== "inactive"
    )
        recorder.stop();

    if(cameraStream){

        cameraStream
            .getTracks()
            .forEach(
                t=>t.stop()
            );

    }

}


function finishRecording(){

    const blob =
        new Blob(
            recordingChunks,
            {
                type:"video/webm"
            }
        );

    const url =
        URL.createObjectURL(
            blob
        );

    const result =
        document.getElementById(
            "recordResult"
        );

    result.innerHTML = `

        <video
            src="${url}"
            controls
            style="
            width:100%;
            margin-top:10px;
            border-radius:15px;
            "
        ></video>

        <input
            id="videoCaption"
            placeholder="Caption..."
            maxlength="150"
        >

        <button
            class="bigbtn"
            onclick="uploadVideo(
                ${JSON.stringify(url)}
            )"
        >
            📤 Post Video
        </button>

    `;

}


async function uploadVideo(localUrl){

    if(!recordingChunks.length){

        alert(
            "Record a video first."
        );

        return;
    }

    const blob =
        new Blob(
            recordingChunks,
            {
                type:"video/webm"
            }
        );

    const filename =
        me.replace(
            /[^A-Za-z0-9]/g,
            ""
        )+
        "_" +
        Date.now()+
        ".webm";

    document.getElementById(
        "recordStatus"
    ).textContent =
        "Uploading... ⏳";


    const upload =
        await db.storage
        .from(VIDEO_BUCKET)
        .upload(
            filename,
            blob,
            {
                contentType:
                    "video/webm",
                upsert:false
            }
        );


    if(upload.error){

        console.error(
            upload.error
        );

        alert(
            "Upload failed: "+
            upload.error.message
        );

        return;
    }


    const publicResult =
        db.storage
        .from(VIDEO_BUCKET)
        .getPublicUrl(
            filename
        );


    const videoUrl =
        publicResult.data.publicUrl;

    const caption =
        document.getElementById(
            "videoCaption"
        ).value.trim();


    const insert =
        await db
        .from("videos")
        .insert({

            username:me,

            avatar:avatar,

            caption:caption,

            video_url:videoUrl

        });


    if(insert.error){

        console.error(
            insert.error
        );

        alert(
            "Video uploaded, but the database record failed: "+
            insert.error.message
        );

        return;
    }


    alert(
        "🎉 Video posted!"
    );

    closeCamera();

    videos();

}


function closeCamera(){

    if(cameraStream){

        cameraStream
        .getTracks()
        .forEach(
            t=>t.stop()
        );

    }

    recorder=null;
    recordingChunks=[];

    closeModal();

}

let flap={
    x:65,
    y:180,
    velocity:0,
    gravity:.42,
    jump:-7,
    pipes:[],
    score:0,
    running:false,
    over:false
};


function setupFlappyCanvas(){

    const c =
        document.getElementById(
            "flappyCanvas"
        );

    if(!c)
        return;

    c.width=360;
    c.height=500;

    c.onclick =
        flapJump;

}


function startFlappy(){

    clearInterval(flappyLoop);

    flap={
        x:65,
        y:220,
        velocity:0,
        gravity:.42,
        jump:-7,
        pipes:[],
        score:0,
        running:true,
        over:false
    };

    const c =
        document.getElementById(
            "flappyCanvas"
        );

    c.onclick =
        flapJump;

    flap.pipes.push({
        x:360,
        gapY:230
    });

    flappyLoop =
        setInterval(
            drawFlappy,
            16
        );

}


function flapJump(){

    if(!flap.running)
        return;

    flap.velocity =
        flap.jump;

}


function drawFlappy(){

    const c =
        document.getElementById(
            "flappyCanvas"
        );

    if(!c){

        clearInterval(
            flappyLoop
        );

        return;
    }

    const ctx =
        c.getContext("2d");

    ctx.clearRect(
        0,0,c.width,c.height
    );


    ctx.fillStyle="#65b7ff";

    ctx.fillRect(
        0,0,c.width,c.height
    );


    flap.velocity +=
        flap.gravity;

    flap.y +=
        flap.velocity;


    if(
        flap.pipes.length===0 ||
        flap.pipes[
            flap.pipes.length-1
        ].x < 190
    ){

        flap.pipes.push({

            x:360,

            gapY:
                120+
                Math.random()*220

        });

    }


    flap.pipes.forEach(
        p=>{
            p.x-=2.5;
        }
    );


    flap.pipes =
        flap.pipes.filter(
            p=>p.x>-70
        );


    flap.pipes.forEach(
        p=>{

            ctx.fillStyle="#48bd63";

            ctx.fillRect(
                p.x,
                0,
                55,
                p.gapY-75
            );

            ctx.fillRect(
                p.x,
                p.gapY+75,
                55,
                500
            );


            if(
                !p.counted &&
                p.x+55<flap.x
            ){

                p.counted=true;

                flap.score++;

                document.getElementById(
                    "flapScore"
                ).textContent=
                    flap.score;

            }

        }
    );


    ctx.fillStyle="#ffd83d";

    ctx.beginPath();

    ctx.arc(
        flap.x,
        flap.y,
        15,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#fff";

    ctx.beginPath();

    ctx.arc(
        flap.x+5,
        flap.y-5,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();


    let hit =
        flap.y<0 ||
        flap.y>500;


    flap.pipes.forEach(
        p=>{

            if(
                flap.x+15>p.x &&
                flap.x-15<p.x+55 &&
                (
                    flap.y-15<p.gapY-75 ||
                    flap.y+15>p.gapY+75
                )
            )
                hit=true;

        }
    );


    if(hit){

        flap.running=false;

        clearInterval(
            flappyLoop
        );

        const best =
            Number(
                localStorage.getItem(
                    "flap_best"
                ) || 0
            );

        if(flap.score>best){

            localStorage.setItem(
                "flap_best",
                flap.score
            );

        }

        document.getElementById(
            "flapBest"
        ).textContent =
            Math.max(
                best,
                flap.score
            );

        setTimeout(
            ()=>{
                alert(
                    "Game Over! Score: "+
                    flap.score
                );
            },
            20
        );

    }

}

function startTapGame(){

    clearInterval(tapTimer);

    let count=0;
    let time=10;

    const btn =
        document.getElementById(
            "tapButton"
        );

    btn.onclick =
        ()=>{
            count++;

            document.getElementById(
                "tapCount"
            ).textContent=count;
        };

    document.getElementById(
        "tapCount"
    ).textContent="0";

    document.getElementById(
        "tapTime"
    ).textContent="10";


    tapTimer =
        setInterval(
            ()=>{

                time--;

                document.getElementById(
                    "tapTime"
                ).textContent=time;

                if(time<=0){

                    clearInterval(
                        tapTimer
                    );

                    btn.onclick=null;

                    alert(
                        "You got "+
                        count+
                        " taps!"
                    );

                }

            },
            1000
        );

}

        b.style.fontSize="35px";

            ()=>{

/* =========================================================
   MEMORY
========================================================= */

function memoryGame(){

    header(
        "Memory",
        "Match pairs"
    );

    const symbols=[
        "🍎","🍎",
        "🐺","🐺",
        "🚀","🚀",
        "🌙","🌙",
        "🎮","🎮",
        "⚡","⚡"
    ];

    symbols.sort(
        ()=>Math.random()-.5
    );

    content.innerHTML=`

    <div
        id="memoryBoard"
        style="
        display:grid;
        grid-template-columns:
        repeat(4,1fr);
        gap:8px
        "
    >

        ${symbols.map(
            (s,i)=>
            `<button
                id="card${i}"
                style="
                height:75px;
                border-radius:15px;
                background:#ffffff10;
                font-size:28px
                "
                onclick="flipCard(${i},'${s}')"
            >
                ?
            </button>`
        ).join("")}

    </div>

    <p
        id="memoryStatus"
        class="sub"
        style="text-align:center;margin-top:15px"
    >
        Find all pairs!
    </p>

    `;

    window.memorySymbols=symbols;
    window.memoryFirst=null;
    window.memoryLock=false;
    window.memoryFound=0;

}


function flipCard(i,s){

    if(window.memoryLock)
        return;

    const b =
        document.getElementById(
            "card"+i
        );

    if(
        b.dataset.done==="1" ||
        b.textContent!=="?"
    )
        return;

    b.textContent=s;

    if(
        window.memoryFirst===null
    ){

        window.memoryFirst={
            i,
            s
        };

        return;

    }

    const first =
        window.memoryFirst;

    if(first.s===s){

        document.getElementById(
            "card"+first.i
        ).dataset.done="1";

        b.dataset.done="1";

        window.memoryFound++;

        window.memoryFirst=null;

        if(
            window.memoryFound===6
        ){

            document.getElementById(
                "memoryStatus"
            ).textContent=
                "🎉 You won!";

        }

    }else{

        window.memoryLock=true;

        setTimeout(
            ()=>{

                document.getElementById(
                    "card"+first.i
                ).textContent="?";

                b.textContent="?";

                window.memoryFirst=null;

                window.memoryLock=false;

            },
            700
        );

    }

}

function setPassword(){

    const p =
        prompt(
            "Password must be 4–12 letters, no spaces."
        );

    if(p===null)
        return;

    if(
        !/^[A-Za-z]{4,12}$/.test(p)
    ){

        alert(
            "Only 4–12 letters."
        );

        return;
    }

    password=p;

    save();

    alert(
        "Password enabled."
    );

}


function changeUsername(){

    const u =
        prompt(
            "New username:"
        );

    if(!u)
        return;

    if(
        !/^[A-Za-z0-9]{3,16}$/.test(u)
    ){

        alert(
            "Invalid username."
        );

        return;
    }

    if(
        banned.some(
            w =>
            u.toLowerCase().includes(w)
        )
    ){

        alert(
            "That username isn't allowed."
        );

        return;
    }

    me=u;

    save();

    settings();

}
